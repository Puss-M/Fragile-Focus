name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu runner 自带 Android SDK（含 compileSdk 34 所需组件），无需额外 setup-android
      - uses: gradle/actions/setup-gradle@v4   # 缓存 ~/.gradle，Gradle 版本由已提交的 wrapper 决定
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fragile-focus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
